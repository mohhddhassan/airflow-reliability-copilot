name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dag-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow + providers
        run: |
          python -m pip install --upgrade pip
          # Providers installed unconstrained: Airflow 3.1.5's constraints
          # file pins common-compat older than what common-ai needs.
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-3.1.5/constraints-3.12.txt"
          pip install "apache-airflow==3.1.5" --constraint "$CONSTRAINT_URL"
          pip install -r requirements.txt

      - name: Run DAG integrity tests
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
        run: |
          airflow db migrate
          pytest tests/test_dag_integrity.py -v
